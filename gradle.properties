# Inherits the global ~/.gradle/gradle.properties Option-A budget (2g daemon, workers.max=2,
# parallel=true, caching). No per-project heap override needed — this is a light module.
org.gradle.caching=true

# This project uses AndroidX. Declared here so the build is self-contained and
# does not depend on an inherited global gradle.properties.
android.useAndroidX=true
